<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Usuarios</title>
    <script src="js.js"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div>
        <button id="consulta">Consulta</button>
        <select id="usuarios">
            <option value="">Seleccione un usuario</option>
        </select>
    </div>
    
    <table id="infoUsuario" class="hidden">
        <tr><th>ID</th><td id="userId"></td></tr>
        <tr><th>Nombre</th><td id="userName"></td></tr>
        <tr><th>Usuario</th><td id="userUsername"></td></tr>
        <tr><th>Email</th><td id="userEmail"></td></tr>
        <tr><th>Teléfono</th><td id="userPhone"></td></tr>
        <tr><th>Empresa</th><td id="userCompany"></td></tr>
    </table>
    
</body>
</html>
