<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <script src="js.js"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Gestor de Tareas</h1>

    <div>
        <input type="text" id="nueva-tarea" placeholder="Escribe una nueva tarea">
        <button id="agregar-tarea">Agregar Tarea</button>
    </div>

    <div>
        <button id="ver-todas">Todas</button>
        <button id="ver-completadas">Completadas</button>
        <button id="ver-pendientes">Pendientes</button>
    </div>

    <div id="lista-tareas"></div>
</body>
</html>
