<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio DOM 12</title>
    <script src="js.js"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form id="formulario">
        <label for="nickname">Nickname:</label>
        <input type="text" id="nickname" name="nickname" required>
        <br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <span id="password-feedback"></span>
        <br>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" required>
        <br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required>
        <br>

        <button type="submit">Registrar Usuario</button>
        <button type="button" id="borrar">Borrar Datos</button>
        <button type="button" id="consultar">Consultar Usuario</button>
        <button type="button" id="ultimo">Consultar Último Login</button>
    </form>

    <div id="resultado"></div>
</body>
</html>
