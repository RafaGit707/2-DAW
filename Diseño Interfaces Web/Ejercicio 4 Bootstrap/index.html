<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 Trabajando con columnas en bootstrap</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-3">
        <div class="row fila1">
            <div class="col-12">
                Fila 1 - Columna 12
            </div>
        </div>
        
        <div class="row">
            <div class="col-12 col-md-2 fila2">
                Columna 2
            </div>
            <div class="col-12 col-md-10">
                <div class="row subfila">
                    <div class="col-12">
                        Subfila 1 - Columna 12
                    </div>
                </div>
                <div class="row subfila-col">
                    <div class="col-6 col-md-6">Columna 6</div>
                    <div class="col-6 col-md-6">Columna 6</div>
                    <div class="col-6 col-md-6">Columna 6</div>
                    <div class="col-6 col-md-6">Columna 6</div>
                </div>
                <div class="row fila3">
                    <div class="col-2">Columna 1</div>
                    <div class="col-2">Columna 2</div>
                    <div class="col-4">Columna 3</div>
                    <div class="col-2">Columna 4</div>
                    <div class="col-2">Columna 5</div>
                    <div class="col-2">Columna 1</div>
                    <div class="col-2">Columna 2</div>
                    <div class="col-4">Columna 3</div>
                    <div class="col-2">Columna 4</div>
                    <div class="col-2">Columna 5</div>
                </div>
            </div>  
            
        </div>
        <div class="row fila1">
            <div class="col-12">
                Fila 3 - Columna 12
            </div>
        </div>
    </div>
</body>
</html>
