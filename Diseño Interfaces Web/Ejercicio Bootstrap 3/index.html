<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño con Números</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 box"  style="background-color: #aaaaaa;">Uno</div>
            <div class="col-md-4 offset-md-4 box"  style="background-color: #aaaaaa;">Dos</div>
        </div>
        <div class="row">
            <div class="col-md-4 mx-auto box" style="background-color: #aaaaaa;">Tres</div>
        </div>
        <div class="row">
            <div class="col-md-4 box" style="background-color: #aaaaaa;">Cuatro</div>
            <div class="col-md-4 offset-md-4 box" style="background-color: #aaaaaa;">Cinco</div>
        </div>
    </div>
</body>
</html>
