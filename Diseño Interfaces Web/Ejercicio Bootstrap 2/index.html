<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Columnas Anidadas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-6 col-12 p-3" style="background-color: #aaaaaa;">
                <h3>Columna 1</h3>
                <p>Esto es una prueba de bootstrap.</p>
            </div>

            <div class="col-lg-6 col-12 p-3" style="background-color: #bbbbbb;">
                <h3>Columna 2</h3>
                <p>Esto es una prueba de bootstrap.</p>

                <div class="row mt-2">
                    <div class="col-md-6 col-12 p-3" style="background-color: #cccccc;">
                        <h4>Columna 2a</h4>
                        <p>Esto es una prueba de bootstrap.</p>
                    </div>
                    <div class="col-md-6 col-12 p-3" style="background-color: #dddddd;">
                        <h4>Columna 2b</h4>
                        <p>Esto es una prueba de bootstrap.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
